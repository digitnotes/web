<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DigitNotes</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  body{-webkit-tap-highlight-color:transparent}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font-weight:700;border-radius:.75rem;padding:.65rem 1rem;transition:.2s}
  .btn-p{background:#059669;color:#fff;box-shadow:0 4px 10px rgba(5,150,105,.25)}.btn-p:hover{background:#047857}
  .btn-s{background:#f1f5f9;color:#334155}.btn-s:hover{background:#e2e8f0}
  .btn-d{background:#fee2e2;color:#b91c1c}.btn-d:hover{background:#fecaca}
  .inp{width:100%;padding:.7rem 1rem;border-radius:.75rem;border:1px solid #e2e8f0;background:#f8fafc;outline:none}
  .inp:focus{border-color:#10b981;box-shadow:0 0 0 3px #d1fae5;background:#fff}
  .card{background:#fff;border:1px solid #f1f5f9;border-radius:1rem;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .lbl{display:block;font-size:.875rem;font-weight:600;color:#334155;margin-bottom:.25rem}
</style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen selection:bg-emerald-200">
<div id="app"></div>
<div id="modal" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm items-center justify-center p-3"></div>
<div id="viewer" class="hidden fixed inset-0 z-[60] bg-black/95 items-center justify-center"></div>
<div id="ctx" class="hidden fixed z-[70] bg-white rounded-xl shadow-2xl border border-slate-200 p-1 min-w-[190px]"></div>
<div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-[80] pointer-events-none"></div>

<script>
// ================= FIREBASE =================
firebase.initializeApp({databaseURL:"https://digitnotes-bdeb7-default-rtdb.europe-west1.firebasedatabase.app"});
const db=firebase.database();

// ================= IKONE (vektorske SVG) =================
const P={
 cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
 book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M20 17v4H6.5A2.5 2.5 0 0 1 4 18.5"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
 out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
 notes:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>',
 hw:'<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M9 14l2 2 4-4"/>',
 grade:'<circle cx="12" cy="8" r="6"/><path d="M15.5 13.9 17 22l-5-3-5 3 1.5-8.1"/>',
 l:'<path d="m15 18-6-6 6-6"/>', r:'<path d="m9 18 6-6-6-6"/>',
 plus:'<path d="M12 5v14M5 12h14"/>', x:'<path d="M18 6 6 18M6 6l12 12"/>',
 trash:'<path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
 dl:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
 up:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
 share:'<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/>',
 pdf:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 15h6M9 18h4"/>',
 img:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>',
 user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
 users:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
 lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
 check:'<path d="M20 6 9 17l-5-5"/>', edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
 swap:'<path d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/>',
 clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
 alert:'<path d="m10.3 3.9-8.5 14.7A2 2 0 0 0 3.5 21h17a2 2 0 0 0 1.7-2.4L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/>',
 coffee:'<path d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4zM6 1v3M10 1v3M14 1v3"/>',
 shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
 home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>'
};
const ic=(n,c='w-5 h-5')=>`<svg class="${c} shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
const logo=`<div class="h-10 w-10 rounded-xl bg-emerald-600 text-white flex items-center justify-center shadow">${ic('book','w-6 h-6')}</div>`;

// ================= POMOČNIKI =================
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const pd=iso=>new Date(iso+'T00:00:00');
const fmt=iso=>pd(iso).toLocaleDateString('sl-SI',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const DAYS=['Ponedeljek','Torek','Sreda','Četrtek','Petek'];
const nodia=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[đĐ]/g,'d');
const abbr=n=>nodia(n).replace(/[^a-zA-Z]/g,'').slice(0,3).toUpperCase()||'ZVE';
const uid8=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
function toast(m,err){const t=document.createElement('div');t.className=`mb-2 px-4 py-3 rounded-xl shadow-xl text-sm font-semibold text-white ${err?'bg-red-600':'bg-slate-800'}`;t.textContent=m;$('toast').appendChild(t);setTimeout(()=>t.remove(),3500)}
function modal(html,wide){const m=$('modal');m.innerHTML=`<div class="bg-white rounded-2xl shadow-2xl w-full ${wide?'max-w-2xl':'max-w-md'} max-h-[92vh] overflow-y-auto p-6">${html}</div>`;m.classList.remove('hidden');m.classList.add('flex')}
function closeModal(){$('modal').classList.add('hidden');$('modal').classList.remove('flex')}
let _cf=null;
function conf(msg,fn,label='Potrdi'){_cf=fn;modal(`<div class="flex items-start gap-3 mb-5"><div class="text-amber-500">${ic('alert','w-7 h-7')}</div><p class="text-slate-700">${msg}</p></div><div class="flex gap-2 justify-end"><button class="btn btn-s" onclick="closeModal()">Prekliči</button><button class="btn btn-d" onclick="closeModal();_cf()">${label}</button></div>`)}
function resize(file,max=1400){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height));const c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};i.onerror=rej;i.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
const PC={};
function getPhoto(uid,pid){return PC[pid]?Promise.resolve(PC[pid]):db.ref(`pd/${uid}/${pid}`).once('value').then(s=>PC[pid]=s.val())}
function hydrate(){document.querySelectorAll('img[data-pid]:not([src])').forEach(im=>getPhoto(im.dataset.uid,im.dataset.pid).then(d=>{if(d)im.src=d}))}

// ================= STANJE =================
let U=null,D={},A={},SH=null,ref=null;
let S={view:'home',date:iso(new Date()),week:false,tab:'nb',nb:null,au:null};
const params=new URLSearchParams(location.search);const SHARE=params.get('share');

function store(){return localStorage.getItem('dn_s')?localStorage:sessionStorage}
function boot(){
  const s=localStorage.getItem('dn_s')||sessionStorage.getItem('dn_s');
  if(s){try{start(JSON.parse(s));return}catch(e){}}
  renderLogin();
}
function start(sess){
  U=sess;if(ref)ref.off();
  if(U.role==='admin'){ref=db.ref('u');ref.on('value',s=>{A=s.val()||{};render()});S.view='admin'}
  else{ref=db.ref('u/'+U.id);ref.on('value',s=>{D=s.val()||{};if(!D.profile){logout();return}render()});S.view='home'}
  if(SHARE){openShared()}
}
function logout(){localStorage.removeItem('dn_s');sessionStorage.removeItem('dn_s');if(ref)ref.off();U=null;D={};A={};SH=null;renderLogin()}

// ================= PRIJAVA =================
function renderLogin(){
  $('app').innerHTML=`
  <nav class="w-full bg-white/80 backdrop-blur-md shadow-sm py-4 px-6 flex items-center space-x-3 sticky top-0 z-20">${logo}<span class="text-xl font-bold text-emerald-700 tracking-tight">DigitNotes</span></nav>
  <main class="relative overflow-hidden min-h-[85vh] flex items-center justify-center px-4 py-10">
    <div class="absolute top-0 right-0 -mr-20 -mt-20 w-64 h-64 rounded-full bg-emerald-100 opacity-60 blur-3xl -z-10"></div>
    <div class="absolute bottom-0 left-0 -ml-20 -mb-20 w-80 h-80 rounded-full bg-teal-100 opacity-60 blur-3xl -z-10"></div>
    <div class="bg-white p-8 rounded-2xl shadow-xl border border-slate-100 w-full max-w-md relative overflow-hidden">
      <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-emerald-400 to-teal-500"></div>
      <h1 class="text-2xl font-bold mb-1">Prijava</h1>
      <p class="text-sm text-slate-500 mb-6 pb-4 border-b border-slate-100">${SHARE?'Za ogled deljenega zvezka se najprej prijavi.':'Vsi šolski zapiski na enem mestu.'}</p>
      <div class="space-y-4">
        <div><label class="lbl">Uporabniško ime</label><div class="relative"><span class="absolute left-3 top-3.5 text-slate-400">${ic('user','w-5 h-5')}</span><input id="lu" class="inp pl-11" autocomplete="username"></div></div>
        <div><label class="lbl">Geslo</label><div class="relative"><span class="absolute left-3 top-3.5 text-slate-400">${ic('lock','w-5 h-5')}</span><input id="lp" type="password" class="inp pl-11" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div></div>
        <label class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer"><input id="lr" type="checkbox" class="w-4 h-4 accent-emerald-600"> Ostani prijavljen v tem računalniku</label>
        <div id="le" class="hidden text-sm text-red-600 bg-red-50 rounded-xl px-3 py-2"></div>
        <button class="btn btn-p w-full" onclick="login()">Prijavi se</button>
        <p class="text-xs text-slate-500 text-center">Pozabljeno geslo? Obrni se na <a class="text-emerald-700 font-semibold underline" href="mailto:informacije@digitnotes.si">informacije</a>.</p>
      </div>
    </div></main>`;
}
async function login(){
  const u=$('lu').value.trim(),p=$('lp').value,err=$('le');
  const fail=m=>{err.textContent=m;err.classList.remove('hidden')};
  if(!u||!p)return fail('Vnesi uporabniško ime in geslo.');
  let sess=null;
  if(u==='ADMIN'&&p==='Admin')sess={role:'admin'};
  else{
    try{
      const id=(await db.ref('idx/'+u.toLowerCase()).once('value')).val();
      if(id){const pr=(await db.ref(`u/${id}/profile`).once('value')).val();if(pr&&pr.password===p)sess={role:'user',id}}
    }catch(e){return fail('Napaka povezave s strežnikom.')}
  }
  if(!sess)return fail('Napačno uporabniško ime ali geslo.');
  ($('lr').checked?localStorage:sessionStorage).setItem('dn_s',JSON.stringify(sess));
  start(sess);
}

// ================= OKVIR =================
const NAV=[['home','Domov','home'],['sched','Urnik','cal'],['nbs','Zvezki','book'],['set','Nastavitve','gear']];
function shell(inner){
  const items=U.role==='admin'?[['admin','Uporabniki','users']]:NAV;
  const btn=(v,l,i)=>`<button onclick="go('${v}')" class="flex md:flex-row flex-col items-center md:gap-3 gap-0.5 md:px-4 px-2 py-2 md:py-3 rounded-xl md:w-full text-xs md:text-sm font-semibold transition ${S.view===v||(v==='nbs'&&S.view==='nb')?'text-emerald-700 bg-emerald-50':'text-slate-500 hover:bg-slate-100'}">${ic(i,'w-6 h-6 md:w-5 md:h-5')}<span>${l}</span></button>`;
  return `<div class="min-h-screen md:pr-60 pb-24 md:pb-0">
  <header class="bg-white/80 backdrop-blur-md shadow-sm py-3 px-5 flex items-center gap-3 sticky top-0 z-20">${logo}<span class="text-xl font-bold text-emerald-700">DigitNotes</span></header>
  <main class="max-w-4xl mx-auto p-4 md:p-8">${inner}</main>
  <nav class="fixed z-30 bg-white border-slate-200 bottom-0 left-0 right-0 border-t flex justify-around px-1 md:top-0 md:left-auto md:right-0 md:bottom-0 md:w-60 md:border-t-0 md:border-l md:flex-col md:justify-start md:gap-1 md:p-4 md:pt-24">
   ${items.map(i=>btn(...i)).join('')}
   <button onclick="logout()" class="flex md:flex-row flex-col items-center md:gap-3 gap-0.5 md:px-4 px-2 py-2 md:py-3 rounded-xl md:w-full text-xs md:text-sm font-semibold text-slate-500 hover:bg-red-50 hover:text-red-600 md:mt-auto">${ic('out','w-6 h-6 md:w-5 md:h-5')}<span>Odjava</span></button>
  </nav></div>`;
}
function go(v){S.view=v;render();scrollTo(0,0)}
function render(){
  if(!U)return;
  let h='';
  if(U.role==='admin')h=S.view==='adminu'?vAdminUser():vAdmin();
  else h={home:vHome,sched:vSched,nbs:vNbs,nb:vNb,set:vSet,shared:vShared}[S.view]();
  $('app').innerHTML=shell(h);hydrate();tick();
}
function tick(){const c=$('clock');if(c)c.textContent=new Date().toLocaleTimeString('sl-SI',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
setInterval(tick,1000);

// ================= URNIK LOGIKA =================
const startMin=h=>7*60+30+(h-1)*55;
function slot(date,h){const wd=(pd(date).getDay()+6)%7;return wd>4?null:D.tt?.[wd+'_'+h]||null}
function nbOf(id){return D.nb?.[id]}
function status(date,h){
  const s=slot(date,h);if(!s)return'empty';if(s.malica)return'malica';
  const l=D.ls?.[date+'_'+h];
  if(l?.saved)return'ok';
  if(l?.assess)return'orange';
  const now=new Date(),dd=pd(date),y=new Date();y.setDate(y.getDate()-1);y.setHours(0,0,0,0);
  const past=dd<new Date(now.getFullYear(),now.getMonth(),now.getDate())||(iso(now)===date&&now.getHours()*60+now.getMinutes()>startMin(h)+45);
  if(past&&dd>=y)return'red';
  return'open';
}
const ST={ok:'bg-emerald-50 border-emerald-300',orange:'bg-orange-50 border-orange-300',red:'bg-red-50 border-red-300',open:'bg-white border-slate-200'};
function dayList(date,compact){
  const wd=(pd(date).getDay()+6)%7;
  if(wd>4)return`<div class="card p-6 text-center text-slate-500">Vikend – ni pouka.</div>`;
  if(D.off?.[date])return`<div class="card p-6 text-center text-slate-500">Urnik je za ta dan izklopljen – zapiskov ni treba vnašati.</div>`;
  let out='';
  for(let h=1;h<=9;h++){
    const s=slot(date,h),st=status(date,h);
    if(!s){if(!compact)out+=`<div class="flex items-center gap-3 px-4 py-2 text-slate-300 text-sm"><span class="w-8 text-center font-bold">${h}.</span>prosto</div>`;continue}
    if(s.malica){out+=`<div class="flex items-center gap-3 px-4 py-3 rounded-xl bg-slate-100 text-slate-500"><span class="w-8 text-center font-bold">${h}.</span>${ic('coffee')}<span class="font-semibold">Malica</span></div>`;continue}
    const n=nbOf(s.nid),l=D.ls?.[date+'_'+h]||{};
    const pc=Object.values(D.pm?.[s.nid]||{}).filter(p=>p.l===date+'_'+h).length;
    out+=`<button onclick="openLesson('${date}',${h})" class="w-full text-left flex items-center gap-3 px-4 py-3 rounded-xl border-2 transition hover:shadow-md ${ST[st]}">
      <span class="w-8 text-center font-bold text-slate-500">${h}.</span>
      <span class="text-2xl">${esc(n?.emoji||'')}</span>
      <span class="flex-1 min-w-0"><span class="block font-bold truncate">${esc(n?.name||'(izbrisan zvezek)')}</span><span class="block text-xs text-slate-500 truncate">${esc(s.teacher||'')}</span></span>
      <span class="flex gap-1.5 text-slate-500">${(l.notes||pc||l.noNotes)?ic('notes','w-4 h-4'):''}${l.hw?ic('hw','w-4 h-4'):''}${l.assess?ic('grade','w-4 h-4 text-orange-500'):''}${st==='red'?ic('alert','w-4 h-4 text-red-500'):''}${st==='ok'?ic('check','w-4 h-4 text-emerald-600'):''}</span></button>`;
  }
  return`<div class="space-y-2">${out}</div>`;
}

// ================= DOMOV =================
function vHome(){
  const now=new Date();
  return`<div class="flex flex-wrap justify-between items-end gap-2 mb-6">
   <div><p class="text-sm text-slate-500">Dobrodošel nazaj</p><h1 class="text-2xl md:text-3xl font-bold">Pozdravljen, <span class="text-emerald-700">${esc(D.profile?.name?.split(' ')[0]||'')}</span>!</h1></div>
   <div class="text-right"><p class="text-sm text-slate-500 capitalize">${fmt(iso(now))}</p><p id="clock" class="text-2xl font-bold text-emerald-700 tabular-nums"></p></div></div>
   <h2 class="font-bold text-lg mb-3 flex items-center gap-2">${ic('cal')} Današnji urnik</h2>${dayList(iso(now))}`;
}

// ================= URNIK =================
function vSched(){
  const d=S.date;
  let body='';
  if(S.week){
    const base=pd(d);const mon=new Date(base);mon.setDate(base.getDate()-((base.getDay()+6)%7));
    body=`<div class="grid md:grid-cols-5 gap-3">${[0,1,2,3,4].map(i=>{const x=new Date(mon);x.setDate(mon.getDate()+i);const k=iso(x);return`<div><h3 class="font-bold text-sm mb-2 text-emerald-700">${DAYS[i]} <span class="text-slate-400 font-normal">${x.getDate()}.${x.getMonth()+1}.</span></h3>${dayList(k,true)}</div>`}).join('')}</div>`;
  }else body=`<h2 class="font-bold text-lg mb-3 capitalize">${fmt(d)}</h2>${dayList(d)}`;
  return`<h1 class="text-2xl font-bold mb-4">Urnik</h1>
  <div class="card p-3 mb-5 flex flex-wrap items-center gap-2">
   <button class="btn btn-s !p-2.5" onclick="shiftDate(-1)">${ic('l')}</button>
   <input type="date" class="inp !w-auto" value="${d}" onchange="S.date=this.value||S.date;render()">
   <button class="btn btn-s !p-2.5" onclick="shiftDate(1)">${ic('r')}</button>
   <button class="btn btn-s" onclick="S.date=iso(new Date());render()">Danes</button>

// PDF
function loadImg(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=src})}
async function makePdf(){
  const c=nbCtx(),ph=sortedPhotos(c);toast('Generiram PDF…');
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'});
  const W=210,H=297,au=nodia(c.author||'');
  doc.setFillColor(5,150,105);doc.rect(0,0,W,110,'F');
  doc.setTextColor(255);doc.setFont('helvetica','bold');doc.setFontSize(34);doc.text(nodia(c.nb.name),W/2,60,{align:'center'});
  doc.setFontSize(14);doc.setFont('helvetica','normal');doc.text('Zvezek',W/2,45,{align:'center'});
  doc.setTextColor(51,65,85);doc.setFontSize(18);doc.text('Avtor: '+au,W/2,150,{align:'center'});
  doc.setFontSize(11);doc.setTextColor(120);doc.text('DigitNotes · '+new Date().toLocaleDateString('sl-SI'),W/2,160,{align:'center'});
  for(let i=0;i<ph.length;i++){
    const d=await getPhoto(c.uid,ph[i].id);if(!d)continue;const im=await loadImg(d);
    doc.addPage();const k=Math.min(190/im.width,255/im.height),w=im.width*k,h=im.height*k;
    doc.addImage(d,'JPEG',(W-w)/2,10,w,h);
    doc.setFontSize(9);doc.setTextColor(120);
    doc.text(c.owner?String(i+1):`${au} - ${i+1}`,W/2,H-8,{align:'center'});
  }
  doc.save(nodia(c.nb.name).replace(/\W+/g,'_')+'.pdf');
}

    const root=(uidT?A[uid]:D)||{},up={};
    up[`u/${uid}/nb/${id}`]=null;up[`u/${uid}/pm/${id}`]=null;
    Object.entries(root.tt||{}).forEach(([k,s])=>{if(s.nid===id)up[`u/${uid}/tt/${k}`]=null});
    Object.entries(root.ls||{}).forEach(([k,l])=>{if(l.nid===id)up[`u/${uid}/ls/${k}`]=null});
    await db.ref().update(up);toast('Zvezek izbrisan.');
  },'Izbriši');
}
function setTt(){
  const opts=sel=>{let o=`<option value="">— prosto —</option><option value="M" ${sel==='M'?'selected':''}>Malica</option>`;
    Object.entries(D.nb||{}).forEach(([id,n])=>(n.teachers||[]).forEach(t=>{const v=id+'|'+t;o+=`<option value="${esc(v)}" ${sel===v?'selected':''}>${esc(n.emoji||'')} ${esc(n.name)} – ${esc(t)}</option>`}));return o};
  let rows='';
  for(let h=1;h<=9;h++){rows+=`<tr><td class="font-bold text-slate-500 pr-2">${h}.</td>`;
    for(let d=0;d<5;d++){const s=D.tt?.[d+'_'+h];const cur=!s?'':s.malica?'M':s.nid+'|'+s.teacher;rows+=`<td class="p-1"><select class="inp !py-2 !px-2 text-sm min-w-[150px]" onchange="ttSet(${d},${h},this.value)">${opts(cur)}</select></td>`}rows+='</tr>'}
  const off=Object.keys(D.off||{}).sort();
  return`<h2 class="font-bold text-lg mb-3">Nastavitve urnika</h2><p class="text-sm text-slate-500 mb-3">Izbereš lahko le predmete, za katere imaš vpisane zvezke. Pri predmetu z več učitelji izbereš, kdo te uči.</p>
  <div class="card p-3 overflow-x-auto mb-8"><table class="w-full"><thead><tr><th></th>${DAYS.map(d=>`<th class="text-left text-sm p-1">${d}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
  <h2 class="font-bold text-lg mb-1">Dotični urnik</h2><p class="text-sm text-slate-500 mb-3">Izklopi urnik za določen dan ali obdobje – aplikacija takrat ne bo zahtevala zapiskov.</p>
  <div class="card p-4"><div class="flex flex-wrap gap-2 items-end"><div><label class="lbl">Od</label><input id="of1" type="date" class="inp"></div><div><label class="lbl">Do (neobvezno)</label><input id="of2" type="date" class="inp"></div><button class="btn btn-p" onclick="offAdd()">Izklopi urnik</button></div>
  <div class="flex flex-wrap gap-2 mt-4">${off.map(d=>`<span class="inline-flex items-center gap-1 px-3 py-1.5 rounded-xl bg-amber-50 border border-amber-200 text-sm">${d.split('-').reverse().join('.')}<button onclick="db.ref('u/${U.id}/off/${d}').remove()">${ic('x','w-3.5 h-3.5')}</button></span>`).join('')||'<span class="text-sm text-slate-400">Noben dan ni izklopljen.</span>'}</div></div>`;
}
function ttSet(d,h,v){
  const r=db.ref(`u/${U.id}/tt/${d}_${h}`);
  if(!v)r.remove();else if(v==='M')r.set({malica:true});else{const i=v.indexOf('|');r.set({nid:v.slice(0,i),teacher:v.slice(i+1)})}
}
function offAdd(){
  const a=$('of1').value,b=$('of2').value||a;if(!a)return toast('Izberi datum.',true);if(b<a)return toast('Konec je pred začetkom.',true);
  const up={};for(let d=pd(a);iso(d)<=b;d.setDate(d.getDate()+1))up[`u/${U.id}/off/${iso(d)}`]=true;
  db.ref().update(up).then(()=>toast('Urnik izklopljen.'));
}
function setAc(){
  const p=D.profile||{};
  return`<h2 class="font-bold text-lg mb-3">Nastavitve računa</h2><div class="card p-5 space-y-4 max-w-md">
   <div><label class="lbl">Uporabniško ime</label><input id="ac_u" class="inp" value="${esc(p.username)}"></div>
   <div><label class="lbl">Novo geslo</label><input id="ac_p" type="password" class="inp" placeholder="Pusti prazno, če ga ne spreminjaš"></div>
   <button class="btn btn-p" onclick="acSave()">Shrani spremembe</button></div>`;
}
async function acSave(){
  const u=$('ac_u').value.trim(),p=$('ac_p').value,old=D.profile.username;
  if(u.length<3)return toast('Uporabniško ime je prekratko.',true);
  if(u.toLowerCase()!==old.toLowerCase()){
    const ex=(await db.ref('idx/'+u.toLowerCase()).once('value')).val();
    if(ex||u.toLowerCase()==='admin')return toast('To uporabniško ime je zasedeno.',true);
    await db.ref('idx/'+old.toLowerCase()).remove();await db.ref('idx/'+u.toLowerCase()).set(U.id);
  }
  const up={username:u};if(p){if(p.length<4)return toast('Geslo je prekratko.',true);up.password=p}
  await db.ref(`u/${U.id}/profile`).update(up);$('ac_p').value='';toast('Račun posodobljen.');
}

// ================= ADMIN =================
function vAdmin(){
  const ids=Object.keys(A).filter(k=>A[k].profile);
  return`<div class="flex justify-between items-center mb-4"><h1 class="text-2xl font-bold flex items-center gap-2">${ic('shield')} Uporabniki</h1><button class="btn btn-p" onclick="userForm()">${ic('plus')} Dodaj uporabnika</button></div>
  <div class="space-y-2">${ids.map(id=>{const p=A[id].profile;const nn=Object.keys(A[id].nb||{}).length;return`<div class="card p-4 flex items-center gap-3 flex-wrap"><button class="flex-1 text-left min-w-[200px]" onclick="S.au='${id}';S.view='adminu';render()"><b>${esc(p.name)}</b> <span class="text-slate-400">@${esc(p.username)}</span><p class="text-xs text-slate-500">${esc(p.email)} · ${nn} zvezkov${p.max!==undefined&&p.max!==''?' (omejitev '+p.max+')':''}</p></button><button class="btn btn-s !p-2" onclick="userForm('${id}')">${ic('edit','w-4 h-4')}</button><button class="btn btn-d !p-2" onclick="delUser('${id}')">${ic('trash','w-4 h-4')}</button></div>`}).join('')||'<div class="card p-8 text-center text-slate-500">Še ni uporabnikov.</div>'}</div>`;
}
function userForm(id){
  const p=(id&&A[id]?.profile)||{};
  modal(`<h3 class="text-lg font-bold mb-4">${id?'Uredi uporabnika':'Nov uporabnik'}</h3><div class="space-y-3">
   <div><label class="lbl">Ime in priimek</label><input id="uf_n" class="inp" value="${esc(p.name)}"></div>
   <div><label class="lbl">E-poštni naslov</label><input id="uf_e" type="email" class="inp" value="${esc(p.email)}"></div>
   <div><label class="lbl">Uporabniško ime</label><input id="uf_u" class="inp" value="${esc(p.username)}"></div>
   <div><label class="lbl">Geslo</label><input id="uf_p" class="inp" value="${esc(p.password)}"></div>
   <div class="flex gap-2 justify-end pt-2"><button class="btn btn-s" onclick="closeModal()">Prekliči</button><button class="btn btn-p" onclick="userSave('${id||''}')">Shrani</button></div></div>`);
}
async function userSave(id){
  const v=k=>$(k).value.trim(),name=v('uf_n'),email=v('uf_e'),un=v('uf_u'),pw=$('uf_p').value;
  if(!name||!email||!un||!pw)return toast('Izpolni vsa polja.',true);
  if(!/^\S+@\S+\.\S+$/.test(email))return toast('Neveljaven e-poštni naslov.',true);
  const k=un.toLowerCase();const ex=(await db.ref('idx/'+k).once('value')).val();
  if((ex&&ex!==id)||k==='admin')return toast('Uporabniško ime je zasedeno.',true);
  const nid=id||uid8();
  if(id&&A[id].profile.username.toLowerCase()!==k)await db.ref('idx/'+A[id].profile.username.toLowerCase()).remove();
  await db.ref('idx/'+k).set(nid);
  await db.ref(`u/${nid}/profile`).update({name,email,username:un,password:pw});
  closeModal();toast('Uporabnik shranjen.');
}
function delUser(id){
  conf(`Izbrisal se bo uporabnik <b>${esc(A[id].profile.name)}</b> z vsemi zvezki in fotografijami.`,async()=>{
    await db.ref('idx/'+A[id].profile.username.toLowerCase()).remove();
    await db.ref('pd/'+id).remove();await db.ref('u/'+id).remove();toast('Uporabnik izbrisan.');
  },'Izbriši');
}
function vAdminUser(){
  const u=A[S.au];if(!u?.profile){S.view='admin';return vAdmin()}
  const p=u.profile,ids=Object.keys(u.nb||{});
  return`<button class="btn btn-s mb-4" onclick="go('admin')">${ic('l')} Nazaj</button>
  <h1 class="text-2xl font-bold">${esc(p.name)}</h1><p class="text-sm text-slate-500 mb-4">@${esc(p.username)} · ${esc(p.email)}</p>
  <div class="card p-4 mb-5 flex flex-wrap items-end gap-3"><div><label class="lbl">Največje število zvezkov</label><input id="mx" type="number" min="0" class="inp !w-40" placeholder="brez omejitve" value="${p.max??''}"></div><button class="btn btn-p" onclick="setMax()">Shrani omejitev</button></div>
  <div class="flex justify-between items-center mb-3"><h2 class="font-bold text-lg">Zvezki (${ids.length})</h2><button class="btn btn-p" onclick="adminAddNb()">${ic('plus')} Dodaj zvezek</button></div>
  <div class="space-y-2">${ids.map(id=>{const n=u.nb[id];return`<div class="card p-4 flex items-center gap-3"><span class="text-3xl">${esc(n.emoji||'')}</span><div class="flex-1"><b>${esc(n.name)}</b><p class="text-xs text-slate-500 flex items-center gap-1">${ic('img','w-3.5 h-3.5')} ${pcount(id,u.pm)} naloženih slik</p></div><button class="btn btn-s !p-2" onclick="nbForm('${id}','${S.au}')">${ic('edit','w-4 h-4')}</button><button class="btn btn-d !p-2" onclick="delNb('${id}','${S.au}')">${ic('trash','w-4 h-4')}</button></div>`}).join('')||'<div class="card p-6 text-center text-slate-500">Uporabnik nima zvezkov.</div>'}</div>`;
}
function adminAddNb(){nbForm(null,S.au);window._nbT=S.au}
function setMax(){
  const v=$('mx').value;const r=db.ref(`u/${S.au}/profile/max`);
  (v===''?r.remove():r.set(+v)).then(()=>toast('Omejitev shranjena.'));
}
// admin ne sme preseči omejitve pri ročnem dodajanju – omejitev velja za uporabnika; admin jo lahko prosto spreminja.

boot();
</script>
</body>
</html>
